<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>plaintextlab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png" />
  <link rel="apple-touch-icon" href="images/favicon-180.png" />
  <link rel="canonical" href="{{SITE_URL}}/index.html" />
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/home.css" />
</head>
<body>
  <div class="site-wrap">

    <header>
      <a href="index.html" class="site-title">
        <img src="images/logo-icon.png" alt="plaintextlab logo" class="site-logo" />
        <span class="prompt">~/</span>plaintextlab<span class="cursor"></span>
      </a>
      <p class="site-desc"># writing about code, tools, and the things in between</p>
      <nav>
        <a href="index.html" class="active">home</a>
        <a href="about.html">about</a>
        <a href="rss.xml">rss</a>
        <a href="https://www.youtube.com/@plaintextlab" target="_blank" rel="noopener">youtube</a>
        <a href="https://github.com/plaintextlab" target="_blank" rel="noopener">github</a>
      </nav>
    </header>

    <div class="search-bar">
      <span class="search-icon">/</span>
      <input type="search" id="search-input" placeholder="search posts..." autocomplete="off" />
    </div>
    <div id="search-count"></div>

    <div class="category-row" id="cat-row">
      <button class="cat-btn active" data-cat="all">All</button>
    </div>

    <div class="section-label" id="posts-label">Posts</div>

    <div id="post-list"></div>

    <div id="no-results">
      <p class="no-res-label">// 404</p>
      <p>No posts match your search.</p>
    </div>

    <div class="pagination" id="pagination"></div>

    <footer>
      <div class="footer-brand"><span>~/</span>plaintextlab</div>
      <div class="footer-links">
        <a href="#">twitter</a>
        <a href="rss.xml">rss</a>
      </div>
    </footer>
    <p class="copyright">© 2026 plaintextlab. All content is original — please don't republish without permission.</p>

  </div>

  <script src="js/home.js"></script>
</body>
</html>
