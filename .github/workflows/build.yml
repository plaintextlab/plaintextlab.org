name: Build and deploy blog

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you trigger it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # this public repo (build.js, css, js, index.html, etc.)

      # Pull markdown posts from a SEPARATE PRIVATE repo, into ./posts/.
      # The private repo's root should contain your *.md files and an
      # images/ folder directly — i.e. what's currently inside posts/,
      # without an extra posts/ wrapper folder inside it.
      - uses: actions/checkout@v4
        with:
          repository: plaintextlab/plaintextlab-posts
          token: ${{ secrets.POSTS_REPO_TOKEN }}
          path: posts

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run build   # runs build.js -> writes dist/

      # Jekyll would otherwise try to process dist/ and can break it
      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
